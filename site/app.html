<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard · Subsigmoid</title>
<meta name="description" content="Skill reports from Gradescope exams: which skills each student is missing, and which wrong answers were slips.">
<!-- Run ../server.py for the secure Databricks summary. Static-only hosting uses data/ samples. -->
<!-- <meta name="subsigmoid-api" content="https://YOUR-APP.databricksapps.com"> -->
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>/* ?embed=1: shown inside the front page as a live preview */ if (new URLSearchParams(location.search).has('embed')) document.documentElement.classList.add('embed');</script>
<style>
.embed body { overflow: hidden; }
.embed .scene { display: none; }
.embed .page { padding-top: 32px; }
:root {
  /* warm palette sampled from the front-page painting */
  --bg: #F3EFE6; --bg-2: #EEE8DB; --panel: #FBF9F4; --line: #E2DBCB; --line-2: #D5CDBB;
  --text: #26231E; --text-2: #5F5A50; --text-3: #8E877A;
  --amber: #EF9F27; --amber-text: #A35F00; --green: #2C9A47;
  --sans: "Geist", ui-sans-serif, system-ui, sans-serif; --mono: "Geist Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }
h1, h2 { margin: 0; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; border-radius: 4px; }
.num { font-variant-numeric: tabular-nums; }

/* header */
.scene { position: absolute; left: 0; right: 0; top: 0; height: 260px; overflow: hidden; pointer-events: none; z-index: 0;
  -webkit-mask-image: linear-gradient(to bottom, #000 0%, rgba(0,0,0,.85) 35%, transparent 100%); mask-image: linear-gradient(to bottom, #000 0%, rgba(0,0,0,.85) 35%, transparent 100%); }
.scene img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 78%; display: block; opacity: .9; }
.top { position: relative; z-index: 2; }
.page { position: relative; z-index: 1; }
.top-in { max-width: 1080px; margin: 0 auto; padding: 0 24px; height: 60px; display: flex; align-items: center; gap: 12px; }
.logo { height: 18px; color: var(--text); flex: none; display: block; }
.logo svg { height: 100%; width: auto; display: block; }
.sl { color: var(--line-2); font-size: 22px; font-weight: 300; margin: 0 2px; }
.crumb { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.crumb:hover { color: var(--text-2); }
.tag { font-size: 12px; color: var(--text-2); border: 1px solid var(--line-2); background: rgba(255,255,255,.5); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
.top-r { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--line-2); background: rgba(255,255,255,.6); font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--bg-2); }
.btn.dark { background: var(--text); color: #fff; border-color: var(--text); }
.btn.dark:hover { background: #3a362f; }
.btn:disabled { opacity: .5; cursor: default; }

/* page */
.page { max-width: 1080px; margin: 0 auto; padding: 72px 24px 96px; }
.back { display: inline-block; font-size: 14px; color: var(--text-2); margin-bottom: 16px; }
.back:hover { color: var(--text); }
.head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.head h1 { font-size: 34px; font-weight: 500; letter-spacing: -.035em; line-height: 1.2; background: linear-gradient(to right, #26231E, #6B6370); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; padding-bottom: .05em; }
.meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; color: var(--text-2); }
.meta .d { color: var(--line-2); }
section { margin-top: 48px; }
.sh { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
.sh h2 { font-size: 16px; font-weight: 600; letter-spacing: -.02em; }
.sh .x { color: var(--text-3); font-size: 13px; }

/* status dot */
.st { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.st::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--line-2); }
.st.ok::before { background: var(--green); }
.st.warn::before { background: var(--amber); }

/* bordered list */
.list { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--panel); }
.row { display: grid; align-items: center; gap: 16px; padding: 14px 18px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
a.row:hover, .row.click:hover { background: var(--bg-2); cursor: pointer; }
.row .t { font-weight: 500; }
.row .s { color: var(--text-2); }
.row .m { color: var(--text-3); font-size: 13px; }
.row .chev { color: var(--text-3); justify-self: end; }
.r-att { grid-template-columns: 16px 1fr auto; }
.r-review { grid-template-columns: 64px minmax(0, 1fr) 56px; }
.r-review .s { overflow-wrap: anywhere; }
.r-review .num { text-align: right; }
.r-exam { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 2fr) 16px; }
.r-skill { grid-template-columns: minmax(0, 1.4fr) 110px minmax(0, 1fr) 150px; }
.r-grp { grid-template-columns: minmax(0, 1fr) 100px minmax(0, 3fr); align-items: start; }

.r-step { grid-template-columns: 20px 170px minmax(0, 1fr); align-items: start; }
.r-step .n { color: var(--text-3); font-family: var(--mono); font-size: 13px; padding-top: 1px; }
.r-step .s b { color: var(--text); font-weight: 600; }
.lede { color: var(--text-2); max-width: 640px; margin: 20px 0 0; font-size: 15px; }
.lede b { color: var(--text); font-weight: 600; }
.up { color: var(--green); }
/* grade → true score */
.db { position: relative; display: block; width: 140px; height: 14px; }
.db::before { content: ""; position: absolute; left: 0; right: 0; top: 6.5px; height: 1px; background: var(--line); }
.db i { position: absolute; top: 3px; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; }
.db i.ln { top: 6px; height: 2px; margin: 0; border-radius: 0; width: 0; background: var(--green); opacity: .55; }
.db i.ln.dn { background: var(--amber); }
.db i.g { background: var(--panel); box-shadow: inset 0 0 0 1.5px var(--text-3); }
.db i.t { background: var(--text); }
.legend { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; font-size: 13px; color: var(--text-2); }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
.legend i.g { box-shadow: inset 0 0 0 1.5px var(--text-3); }
.legend i.t { background: var(--text); }
.legend .m { color: var(--text-3); }
/* stats strip */
.strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 12px; margin-top: 32px; background: var(--panel); }
.strip div { padding: 16px 18px; border-left: 1px solid var(--line); }
.strip div:first-child { border-left: 0; }
.strip span { display: block; color: var(--text-2); font-size: 13px; }
.strip b { display: block; font-size: 24px; font-weight: 600; letter-spacing: -.03em; margin-top: 2px; font-variant-numeric: tabular-nums; }

/* tiny bar */
.tb { display: inline-flex; align-items: center; gap: 10px; font-variant-numeric: tabular-nums; }
.tb i { width: 56px; height: 4px; border-radius: 999px; background: var(--line); position: relative; overflow: hidden; }
.tb i::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--w); background: var(--text); border-radius: 999px; }
.lo { color: var(--amber-text); }
.tb.lo i::after { background: var(--amber); }

/* tables */
.tbl { width: 100%; border-collapse: collapse; }
.tbl th { text-align: left; font-weight: 500; font-size: 13px; color: var(--text-2); padding: 10px 18px; background: #F5F1E7; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 12px 18px; border-top: 1px solid var(--line); }
.tbl tbody tr:first-child td { border-top: 0; }
.tbl .r { text-align: right; }
.tbl tr.go { cursor: pointer; }
.tbl tr.go:hover td { background: var(--bg-2); }
.tbl tr.open td { background: var(--bg-2); }
.tbl td.w { font-weight: 500; }
.tbl td.q { color: var(--text-3); font-family: var(--mono); font-size: 13px; width: 48px; }
.tscroll { overflow-x: auto; }
tr.det td { padding: 0 18px 14px; background: var(--bg-2); border-top: 0; }
.alist { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0 24px; }
.alist div { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 13px; }
.alist div span:first-child { color: var(--text-2); }

.search { height: 32px; width: 220px; border: 1px solid var(--line-2); border-radius: 6px; padding: 0 10px; font: inherit; font-size: 14px; background: var(--panel); color: var(--text); }
.search:focus { outline: none; border-color: var(--text-3); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; padding: 2px; gap: 2px; }
.seg a { padding: 4px 10px; border-radius: 6px; font-size: 13px; color: var(--text-2); }
.seg a[aria-current] { background: var(--bg-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
.note { color: var(--text-2); margin: 0; }
.callout { border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; color: var(--text-2); display: flex; gap: 10px; align-items: flex-start; background: var(--panel); }
.callout::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--amber); margin-top: 6px; flex: none; }
.cb { width: 16px; height: 16px; border-radius: 4px; border: 1px solid var(--line-2); background: var(--bg); padding: 0; cursor: pointer; display: inline-grid; place-items: center; }
.cb.on { background: var(--text); border-color: var(--text); }
.cb.on::after { content: ""; width: 7px; height: 4px; border: 1.6px solid #fff; border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
.tbl th.c, .tbl td.c { text-align: center; }
.actions { display: flex; gap: 8px; align-items: center; margin-top: 16px; flex-wrap: wrap; }
.join { display: flex; justify-content: space-between; align-items: center; gap: 16px; border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-top: 32px; flex-wrap: wrap; background: var(--panel); }
.join code { font-family: var(--mono); font-size: 14px; }
.drop { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 64px 24px; border: 1px dashed var(--line-2); border-radius: 12px; cursor: pointer; text-align: center; margin-top: 32px; }
.drop:hover, .drop.over { background: var(--bg-2); border-color: var(--text-3); }
.drop b { font-weight: 500; }
.drop span { color: var(--text-2); }
.drop input { display: none; }
.empty { padding: 96px 0; text-align: center; color: var(--text-3); }

@media (max-width: 760px) {
  .top-in { padding: 0 16px; }
  .tag, .sl, .hide-sm { display: none; }
  .page { padding: 48px 16px 72px; }
  .scene { height: 200px; }
  .head h1 { font-size: 26px; }
  .strip { grid-template-columns: 1fr 1fr; }
  .strip div:nth-child(3) { border-left: 0; }
  .strip div:nth-child(n+3) { border-top: 1px solid var(--line); }
  .r-exam { grid-template-columns: 1fr 16px; }
  .r-exam > :nth-child(2), .r-exam > :nth-child(3) { grid-column: 1; }
  .r-exam .chev { grid-row: 1; grid-column: 2; }
  .r-skill { grid-template-columns: 1fr 90px; }
  .r-skill > :nth-child(3) { display: none; }
  .r-grp { grid-template-columns: 1fr 90px; }
  .r-grp > :nth-child(3) { grid-column: 1 / -1; }
  .search { width: 100%; }
  .r-step { grid-template-columns: 20px 1fr; }
  .r-step .s { grid-column: 2; }
}
</style>
</head>
